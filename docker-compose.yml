version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: barbearia_db
    environment:
      POSTGRES_DB: barbearia_db
      POSTGRES_USER: barbearia_user
      POSTGRES_PASSWORD: barbearia_pass_2024
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "7890:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - barbearia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia_user -d barbearia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barbearia_backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-barbearia-2024-change-in-production"
      DATABASE_URL: "postgresql://barbearia_user:barbearia_pass_2024@db:5432/barbearia_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,192.168.0.6,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:7892,http://127.0.0.1:7892,http://192.168.0.6:7892"
    ports:
      - "7891:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - barbearia_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: barbearia_nginx
    ports:
      - "7892:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - backend
    networks:
      - barbearia_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (para cache e Celery)
  redis:
    image: redis:7-alpine
    container_name: barbearia_redis
    ports:
      - "7893:6379"
    volumes:
      - redis_data:/data
    networks:
      - barbearia_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  redis_data:
    driver: local

networks:
  barbearia_network:
    driver: bridge
